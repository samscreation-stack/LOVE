<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#020005">
    <meta name="robots" content="noindex, nofollow">
    <meta property="og:title" content="💗 I made this heartbeat for you">
    <meta property="og:description" content="A little something from the heart. Open it when you're ready.">
    <title>💗 I made this heartbeat for you, Maleka</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Fira+Code:wght@400;500&family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="start-overlay" id="startOverlay">
        <div class="glass-card">
            <div class="card-glow"></div>
            <div class="card-icon" aria-hidden="true">💓</div>
            <h2 class="card-title">From love</h2>
            <div class="loading-bar-container" role="progressbar" aria-label="Loading">
                <div class="loading-bar" id="loadingBar"></div>
            </div>
            <p class="status-text" id="statusText" aria-live="polite">Ready to compile...</p>
            <button class="start-btn" id="startBtn" type="button" disabled>
                <span class="btn-text">Do not click 🚨 (you will become obsessed)</span>
                <span class="btn-shine"></span>
            </button>
        </div>
    </div>

    <canvas id="c" role="img" aria-label="A heart made of falling love words, beating. Tap it to open a letter."></canvas>

    <button class="sound-btn" id="soundBtn" type="button" aria-label="Mute heartbeat sound">🔊</button>

    <div class="tap-hint" id="tapHint" aria-hidden="true">tap the heart to open your letter 💌</div>

    <div class="letter-overlay" id="letterOverlay">
        <div class="letter-card" id="letterCard" role="dialog" aria-modal="true" aria-labelledby="letterHeaderTitle">
            <button class="letter-close" id="letterClose" type="button" aria-label="Close letter">&times;</button>
            <div class="letter-header">
                <span id="letterHeaderTitle">for you</span>
                <button class="letter-edit-btn" id="letterEditBtn" type="button" title="Edit letter" aria-label="Edit letter" aria-pressed="false">
                    <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor" aria-hidden="true">
                        <path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04c.39-.39.39-1.02 0-1.41l-2.34-2.34c-.39-.39-1.02-.39-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/>
                    </svg>
                </button>
            </div>

            <div class="letter-view-container" id="letterViewContainer">
                <div class="letter-body" id="letterBody"></div>
                <div class="letter-sign" id="letterSign">— coded with love by Sam</div>
            </div>

            <div class="letter-edit-container" id="letterEditContainer">
                <div class="form-group">
                    <label for="recipientInput">To</label>
                    <input type="text" id="recipientInput" maxlength="30" placeholder="Recipient name" autocomplete="off">
                </div>
                <div class="form-group">
                    <label for="senderInput">From</label>
                    <input type="text" id="senderInput" maxlength="30" placeholder="Sender name" autocomplete="off">
                </div>
                <div class="form-group">
                    <label for="messageInput">Letter</label>
                    <textarea id="messageInput" rows="6" maxlength="800" placeholder="Your love letter..."></textarea>
                </div>
                <div class="form-actions">
                    <button class="form-btn save-btn" id="saveLetterBtn" type="button">Save &amp; preview</button>
                    <button class="form-btn share-btn" id="shareLetterBtn" type="button">Copy link</button>
                </div>
                <div class="share-toast" id="shareToast" role="status" aria-live="polite">Link copied to clipboard!</div>
            </div>
        </div>
    </div>

    <div class="msg" id="msg">
        <p class="m1">This is my Helianthus</p>
        <p class="m2">for <span>Maleka</span> 💗</p>
    </div>

    <noscript>
        <p style="position:fixed;inset:0;display:grid;place-items:center;color:#fff;z-index:300;background:#020005;font-family:sans-serif;text-align:center;padding:24px">
            This page needs JavaScript turned on to show its heartbeat 💗
        </p>
    </noscript>

    <script src="script.js"></script>
</body>

</html>
